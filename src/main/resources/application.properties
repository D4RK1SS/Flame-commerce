spring.application.name=flame-commerce
server.port=8080

# Banco H2 em arquivo (dados persistem em ./data). Para MySQL/PostgreSQL basta trocar url/driver.
spring.datasource.url=jdbc:h2:file:./data/flame;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Interface em português do Brasil (moeda R$ 1.234,56 e datas dd/MM/yyyy)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.error.include-message=never

# Requisito não funcional (HTTPS): em produção ativar SSL (server.ssl.*) ou usar proxy reverso com TLS.
